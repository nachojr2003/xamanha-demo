  Molde: clients/demo-nakamine/site/panel.html. Marca: #161616 + azul #2274CC (Albert Sans / Roboto).

  ENDPOINT (GET https://meta.ijvagency.com/webhook/xamanha-demo-panel), mismo JSON que nakamine-demo-panel:
    { ok:true, generado:ISO, leads:[ { lead_id, session_id, nombre, telefono, calificacion?, resumen, estado, programado_para?, creado } ] }
    resumen = context_summary en DOS formatos (el parser acepta ambos):
      draft:   <Alta|Media|Baja>; Svc: …; Det: …; Dest: …; Fecha: …; Pickup: …; Pax: …; Hotel: …; Room: …; Vuelo: …; Precio: …; Concierge: …; Lang: …; <nota>
      pending: Calificación: <texto de arriba> | <último mensaje del viajero>
    estado: draft→Ficha completa · pending→Reserva por confirmar · verified→Disponibilidad confirmada · rejected→Perdido
  Sesiones: grp_demo_* = Grupo hotel · wa_demo_* = WhatsApp · web_* y otras = Web. Se excluyen ijv-smoke-*, eval_* salvo ?incluir_pruebas=1.
  PROPUESTA / MAQUETA (rotulado en pantalla): «Enviar a sistema de reservas», Seguimientos, integración Kommo, pasos posteriores del pipeline.
  Parámetros: ?vista=atender|reservas|pipeline|hoteles|seguimientos|gerencia · ?mock=1 solo ejemplos · ?incluir_pruebas=1
  AJUSTAR EL PARSER: la lista ETIQUETAS (arriba del script) mapea cada campo a sus abreviaturas; agregar una abreviatura = 1 línea.
  Todos los datos marcados EJEMPLO son ficticios.
-->

   +'<div class="box"><h3>Por canal</h3>'+bars(cuenta(rows,'canal',CANALES))+'</div>'
   +'<div class="box"><h3>Leads por prioridad</h3>'+bars(cuenta(rows,'prio',['Alta','Media','Baja','Sin prioridad']))+'<p class="sub">Interna: nunca se le dice al viajero.</p></div></div>';
  h+='<p class="sub">Venta cruzada = transfer ofrecido junto con un tour; en las fichas EN VIVO aún no se marca (se mide con datos reales). Los conteos incluyen los ejemplos ficticios salvo que filtres.</p>';
  return h;
}
function banda(){
  return '<section class="band"><h3>Tu mes hoy <span class="chip c-mk" style="background:#3a3a3a;color:#ddd">cifras del equipo, sin promesa de resultados</span></h3><div class="bgrid">'
   +'<div class="bk"><b>≈ US$ 2,000</b><span>pauta al mes (≈ MXN 40,000)</span></div>'
   +'<div class="bk"><b>6–8 por día</b><span>leads nuevos (≈ 180–240 al mes)</span></div>'
   +'<div class="bk"><b>≈ 70 %</b><span>conversión, según Rodolfo (no auditado)</span></div>'
   +'<div class="bk"><b>US$ 8–11</b><span>de pauta por lead</span></div>'
   +'<div class="bk"><b>2 personas</b><span>en reservas hoy</span></div></div>'
   +'<p>Fórmulas: pauta ÷ leads al mes = US$ 2,000 ÷ 240 ≈ 8.3 hasta US$ 2,000 ÷ 180 ≈ 11.1 por lead · leads/día × 30 = 180 a 240 al mes · 70 % de 180–240 ≈ 126–168 clientes nuevos. Son tus números de la reunión; la demo no promete que cambien.</p></section>';
}
function render(){
  var lv=$('#live');
  if(MOCK){lv.className='live';lv.textContent='Modo ejemplo (?mock=1)';}
  else if(S.liveOk){lv.className='live on';lv.textContent='En vivo · '+S.live.length+' solicitudes reales';}
  else if(S.liveOk===false){lv.className='live off';lv.textContent='Sin datos en vivo todavía · mostrando ejemplos';}
  else{lv.className='live';lv.textContent='Cargando…';}
  $('#nav').innerHTML=VISTAS.map(function(v){return '<button data-v="'+v.id+'" class="'+(v.id===S.view?'on':'')+'">'+v.n+'</button>';}).join('');
  var fn={atender:vAtender,reservas:vReservas,pipeline:vPipeline,hoteles:vHoteles,seguimientos:vSeg,gerencia:vGerencia}[S.view]||vAtender;
  var keepQ=document.activeElement&&document.activeElement.id==='fq';
  $('#main').innerHTML=banda()+fn();
  if(keepQ){var q=$('#fq');if(q){q.focus();q.setSelectionRange(q.value.length,q.value.length);}}
}

/* ====== Eventos ====== */
function setView(v){S.view=v;try{history.replaceState(null,'',location.pathname+'?'+(function(){var p=new URLSearchParams(location.search);p.set('vista',v);return p.toString();})());}catch(e){}render();}
document.addEventListener('click',function(ev){
  var vb=ev.target.closest('[data-v]');if(vb){setView(vb.getAttribute('data-v'));return;}
  var b=ev.target.closest('[data-a]');if(!b||b.tagName==='SELECT')return;
  var card=b.closest('[data-id]'),id=(card||b).getAttribute('data-id'),l=S.all.filter(function(x){return x.id===id;})[0];if(!l)return;
  var a=b.getAttribute('data-a');
  if(a==='copy')copiar(textoReserva(l)).then(function(){toast('Copiado en formato de reserva');},function(){toast('No se pudo copiar');});
  else if(a==='send')toast('PROPUESTA: aquí la ficha se enviaría a tu sistema de reservas. En esta demo no se envía nada.');
  else if(a==='toque'){var e=edOf(id);e.toques=Math.min(3,(l.toques||0)+1);e.toqueAt=Date.now();saveEd();build();render();toast('Toque marcado (maqueta, no se envió nada)');}
  else if(a==='perdido'){edOf(id).etapa='perdido';saveEd();build();render();}
});
document.addEventListener('change',function(ev){
  var t=ev.target;
  if(t.getAttribute('data-f')){S.f[t.getAttribute('data-f')]=t.value;render();return;}
  if(t.getAttribute('data-a')==='etapa'){var id=t.closest('[data-id]').getAttribute('data-id');edOf(id).etapa=t.value;saveEd();build();render();}
});
document.addEventListener('input',function(ev){if(ev.target.id==='fq'){S.f.q=ev.target.value;render();}});
$('#bRef').addEventListener('click',function(){pull().then(function(){toast('Actualizado');});});
function csvCell(v){v=String(v==null?'':v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}
$('#bCsv').addEventListener('click',function(){
  var cols=['Origen','Canal','Prioridad','Etapa','NAME','DATE','SERVICE','Tipo de servicio','Destino','PICK UP TIME','ADULTS/KIDS (PAX)','HOTEL','ROOM','FLIGHT','AIRLINE','PRICE','CONCIERGE','Idioma','Nota'];
  var rows=filt(S.all).map(function(l){var av=splitVuelo(l.vuelo);return [l.origen,l.canal,l.prio,ETAPAS[EIDX[l.etapa]].n,l.nombre,l.fecha,l.det,l.svc,l.dest?DESTS[l.dest]:'',l.pickup,l.pax,l.hotel,l.room,av.n,av.a,l.precio,l.concierge,l.lang,l.nota2].map(csvCell).join(',');});
  var blob=new Blob(['﻿'+cols.map(csvCell).join(',')+'\n'+rows.join('\n')],{type:'text/csv;charset=utf-8'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='reservas-xamanha-demo.csv';document.body.appendChild(a);a.click();document.body.removeChild(a);toast('CSV exportado ('+rows.length+' filas)');
});

/* ====== Arranque ====== */
var v0=Q.get('vista');if(v0&&VISTAS.some(function(v){return v.id===v0;}))S.view=v0;
build();render();pull();
if(!MOCK)setInterval(pull,30000);
})();
</script>
</body>
</html>
